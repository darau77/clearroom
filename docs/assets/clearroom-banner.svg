    <g stroke="#dcebba" stroke-width="2.8" stroke-linecap="round"><path d="M75 68v5m7-13v21m8-25v28m7-17v10" /></g>
    <text x="122" y="80" fill="#253b33" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" letter-spacing="-1">Clearroom<tspan fill="#789167">.</tspan></text>
    <g fill="#253b33" font-family="Georgia, 'Times New Roman', serif" font-size="56" letter-spacing="-1.5">
      <text x="64" y="176">Room to pause.</text>
      <text x="64" y="240">Room to try again.</text>
    </g>
    <text x="66" y="287" fill="#596b5c" font-family="Arial, Helvetica, sans-serif" font-size="20">Rehearse difficult conversations with AI.</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      <rect x="64" y="326" width="129" height="36" rx="18" fill="#e1edbd" />
