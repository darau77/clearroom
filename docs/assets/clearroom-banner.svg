    <rect x="822" y="85" width="351" height="109" rx="20" fill="#fff" stroke="#dce5d5" />
    <circle cx="866" cy="139" r="23" fill="#2c5546" />
    <g stroke="#e1edbd" stroke-width="2.5" stroke-linecap="round"><path d="M854 137v5m8-14v22m8-25v28m8-17v9" /></g>
    <text x="906" y="124" fill="#60715b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">PRACTISE</text>
    <text x="906" y="158" fill="#253b33" font-family="Georgia, 'Times New Roman', serif" font-size="25">Find your words.</text>
    <path d="M1068 205c0 17-28 10-39 29" fill="none" stroke="#718763" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)" />
    <rect x="788" y="246" width="374" height="115" rx="20" fill="#d7e1cf" />
