<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">Clearroom — Room to pause. Room to try again.</title>
  <desc id="description">A cream and forest-green banner with conversation cards: practise, reflect, and try again.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="418" rx="28" /></clipPath>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#718763" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker>
  </defs>
  <rect x="1" y="1" width="1278" height="418" rx="28" fill="#f8f9f6" stroke="#dfe6d9" stroke-width="2" />
  <g clip-path="url(#frame)">
    <circle cx="1098" cy="206" r="258" fill="#e9f0e4" />
    <circle cx="1098" cy="206" r="213" fill="none" stroke="#d8e3cf" />
    <circle cx="1098" cy="206" r="173" fill="none" stroke="#d8e3cf" />
