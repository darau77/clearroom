      <rect x="203" y="326" width="129" height="36" rx="18" fill="#e9f0e4" />
      <text x="267.5" y="349" fill="#304b36">Avatar calls</text>
      <rect x="342" y="326" width="153" height="36" rx="18" fill="#f7e7dc" />
