    <text x="856" y="282" fill="#60715b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">REFLECT &amp; TRY AGAIN</text>
    <text x="811" y="326" fill="#253b33" font-family="Georgia, 'Times New Roman', serif" font-size="25">A little clearer, each time.</text>
